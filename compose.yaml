# Dev stack: RabbitMQ for devices, Kafka between services, Postgres with PostGIS for state.
services:
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "1883:1883"     # MQTT, what the cameras use
      - "5672:5672"     # AMQP, what the bridge uses
      - "15672:15672"   # management UI
    environment:
      RABBITMQ_DEFAULT_USER: atms
      RABBITMQ_DEFAULT_PASS: atms-dev
    volumes:
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-atms.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 12

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0     # consumers join at once, matters for tests and restarts
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  postgres:
    image: postgis/postgis:16-3.4
    ports:
      - "5433:5432"     # 5433 because 5432 is often taken on dev machines
    environment:
      POSTGRES_USER: atms
      POSTGRES_PASSWORD: atms-dev
      POSTGRES_DB: atms
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atms -d atms"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
